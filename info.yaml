
# Tiny Tapeout project information
project:
  title: "VGA Controller with External QSPI Flash"
  author: "Leen Khamaysi and Sari Awabdy"
  discord: ""
  description: "VGA controller displaying images from W25Q128JV QSPI Flash"
  language: "Verilog"
  clock_hz: 25000000

  # Initial allocation for testing.
  # May need to increase after synthesis.
  tiles: "1x1"

  top_module: "tt_um_sari_leen_vga_qspi"

  source_files:
    - "tt_um_sari_leen_vga_qspi.v"
    - "integration_top.v"
    - "qspi_reader.v"
    - "vga_controller.v"

pinout:
  # Inputs
  ui[0]: "QSPI late sampling"
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # VGA outputs
  uo[0]: "VGA R1"
  uo[1]: "VGA G1"
  uo[2]: "VGA B1"
  uo[3]: "VGA VSYNC"
  uo[4]: "VGA R0"
  uo[5]: "VGA G0"
  uo[6]: "VGA B0"
  uo[7]: "VGA HSYNC"

  # QSPI Flash
  uio[0]: "Flash CS#"
  uio[1]: "QSPI IO0"
  uio[2]: "QSPI IO1"
  uio[3]: "QSPI SCK"
  uio[4]: "QSPI IO2"
  uio[5]: "QSPI IO3"
  uio[6]: "RAM CS1# (inactive)"
  uio[7]: "RAM CS2# (inactive)"

yaml_version: 6
